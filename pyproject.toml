[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quip-miner-dwave"
version = "0.3.0"
description = "D-Wave (Ocean) QPU Ising miner for the quip.network v0.3 protocol"
readme = "README.md"
# Floor set by quip_proto, which requires >=3.11. Declaring 3.10 here made a
# 3.10 install fail at dependency resolution instead of at metadata check.
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# quip_proto is the PyO3 SDK (miner gRPC stubs + scoring/wire/session). Tracks
# quip-protocol's `v0.3` branch and is built from source via maturin until it is
# published to PyPI (needs Rust + protoc at install time). v0.3 has not merged to
# quip-protocol's `main`, which is still v0.2.
#
# A branch, not a rev: installs resolve it at build time, so two installs on
# different days can pick up different consensus primitives. That is deliberate
# while v0.3 moves; pin a rev here once the protocol settles.
#
# No `#subdirectory=` fragment: as of the v0.3 cutover the SDK's pyproject.toml
# is the repo root (maturin, python-source = "python"). Naming the old `python`
# subdirectory makes pip check out the ref and then fail with "does not appear
# to be a Python project".
dependencies = [
    "quip_proto @ git+https://gitlab.com/quip.network/quip-protocol.git@v0.3",
    "dwave-ocean-sdk>=9.0.0,<10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

# Console entry point matches the code's prog name and the coordinator's
# default binary for the dwave backend.
[project.scripts]
quip-dwave-qa = "quip_miner_dwave.cli:main"

[project.urls]
Repository = "https://gitlab.com/quip.network/quip-miner-dwave"

[tool.setuptools.packages.find]
include = ["quip_miner_dwave*"]
