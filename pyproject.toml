[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quip-miner-dwave"
version = "0.3.4"
description = "D-Wave (Ocean) QPU Ising miner for the quip.network v0.3 protocol"
readme = "README.md"
# Floor set by quip_solver_core, which requires >=3.11. Declaring 3.10 here
# made a 3.10 install fail at dependency resolution instead of at metadata
# check.
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# quip_solver_core is the published PyO3 SDK (miner gRPC stubs +
# scoring/wire/session), installed as a prebuilt wheel from PyPI.
#
# An exact version, not a floating range. This repo has no lockfile, so a
# floating dependency let two installs on different days resolve different
# consensus primitives — tolerable while the SDK lived at a moving git branch,
# not for a stable release. Move the pin deliberately, together with a version
# bump.
dependencies = [
    "quip-solver-core==0.0.2rc1",
    "dwave-ocean-sdk>=9.0.0,<10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis"]

# Console entry point matches the code's prog name and the coordinator's
# default binary for the dwave backend.
[project.scripts]
quip-dwave-qa = "quip_miner_dwave.cli:main"

[project.urls]
Repository = "https://gitlab.com/quip.network/quip-miner-dwave"

[tool.setuptools.packages.find]
include = ["quip_miner_dwave*"]

# Pyright resolves imports from the project venv; without this it cannot see
# quip_solver_core or the Ocean SDK and reports every import as missing.
[tool.pyright]
venvPath = "."
venv = ".venv"
