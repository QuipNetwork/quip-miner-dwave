[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quip-miner-dwave"
version = "0.3.0rc2"
description = "D-Wave (Ocean) QPU Ising miner for the quip.network v0.3 protocol"
readme = "README.md"
# Floor set by quip_proto, which requires >=3.11. Declaring 3.10 here made a
# 3.10 install fail at dependency resolution instead of at metadata check.
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# quip_proto is the PyO3 SDK (miner gRPC stubs + scoring/wire/session). It comes
# from quip-miner's GitLab PyPI package registry, not from a git URL, so
# installing this miner does not have to compile the Rust extension:
#
#   pip install --extra-index-url \
#     https://gitlab.com/api/v4/projects/71492472/packages/pypi/simple ...
#
# The registry serves a cp311-abi3 wheel for macOS/arm64 (one wheel for every
# CPython >= 3.11) and an sdist for everything else. The sdist still needs Rust
# and protoc; the wheel needs neither. A version range, not a pin: v0.3 is still
# moving, so a floor plus the 0.4 wall keeps rc-to-rc bumps from having to land
# in lockstep across both repos. Pin exactly once the protocol settles.
dependencies = [
    "quip_proto>=0.3.0rc3,<0.4.0",
    "dwave-ocean-sdk>=9.0.0,<10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

# Console entry point matches the code's prog name and the coordinator's
# default binary for the dwave backend.
[project.scripts]
quip-dwave-qa = "quip_miner_dwave.cli:main"

[project.urls]
Repository = "https://gitlab.com/quip.network/quip-miner-dwave"

[tool.setuptools.packages.find]
include = ["quip_miner_dwave*"]
