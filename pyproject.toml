[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quip-miner-dwave"
version = "0.3.0"
description = "D-Wave (Ocean) QPU Ising miner for the quip.network v0.3 protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }

# quip_proto is the PyO3 SDK (miner gRPC stubs + scoring/wire/session). Pinned
# to a quip-protocol rev and built from source via maturin until it is published
# to PyPI (needs Rust + protoc at install time). This is the same rev that
# quip-miner-metal and quip-miner-cpu pin; it lives on quip-protocol's `v0.3`
# branch, which has not merged to `main` yet.
dependencies = [
    "quip_proto @ git+https://gitlab.com/quip.network/quip-protocol.git@9c06503861fc90161a0f964bf63d4a1e89c260de#subdirectory=python",
    "dwave-ocean-sdk>=9.0.0,<10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

# Console entry point matches the code's prog name and the coordinator's
# default binary for the dwave backend.
[project.scripts]
quip-dwave-qa = "quip_miner_dwave.cli:main"

[project.urls]
Repository = "https://gitlab.com/quip.network/quip-miner-dwave"

[tool.setuptools.packages.find]
include = ["quip_miner_dwave*"]
