stages: [test, build, release]

variables:
  PKG: quip-miner-dwave

default:
  image: python:3.12-slim
  tags: [linux, amd64]
  # quip_solver_core installs from a published PyPI wheel on Linux -> no Rust,
  # protoc, or compiler needed here.
  before_script:
    - pip install -q --upgrade pip

test:
  stage: test
  script:
    - pip install -e ".[dev]"
    - pytest quip_miner_dwave/tests -v

# End-to-end contract gate: drives the mock-mode miner through
# quip-solver-drive, the scripted coordinator from the published
# quip-solver-conformance crate. This harness caught the credit-ledger and
# sweeps-echo defects that the unit suite could not; without this job the
# repo's only conformance coverage lives in the Rust miner repos.
#
# The rust image is bookworm, so its apt python3 (3.11) meets the >= 3.11
# floor. Keep --version in step with the quip-solver-core pin in
# pyproject.toml: both publish from one repository and one tag.
conformance:
  stage: test
  image: rust:1.97.1
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends python3 python3-venv python3-pip
    - python3 -m venv /opt/venv
    - /opt/venv/bin/pip install -q -e ".[dev]"
  script:
    - cargo install --locked quip-solver-conformance --version 0.0.1-rc2
    - QUIP_SOLVER_DRIVE="$CARGO_HOME/bin/quip-solver-drive" /opt/venv/bin/pytest quip_miner_dwave/tests/test_conformance.py -v

build-wheel:
  stage: build
  script:
    - pip install -q build
    - python -m build --wheel
    - ls -l dist/
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# The coordinator spawns miners as subprocesses (`[dwave] binary =
# "quip-dwave-qa"`), so the miner also ships the way the CPU, CUDA and Metal
# miners do: one self-contained executable per OS/arch, named so that stripping
# the suffix gives the binary the coordinator asks for. The user's machine
# needs nothing but the file.
#
# Runs on the group's Apple Silicon runners (`cray`, `tesla-arm`), which are
# shell executors: `image:` does not apply and the default before_script's
# apt-get would fail, so this job replaces it wholesale.
build-macos-arm64:
  stage: build
  tags: [macos, arm64]
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    # The shell executor starts a non-login bash, which reads no profile, so
    # Homebrew's prefix is on PATH only where a runner happens to export it
    # elsewhere. The v0.3.2-rc5 tag failed on one runner with
    # "brew: command not found" while the same job passed on another. Put both
    # prefixes on PATH (Apple Silicon, then Intel) and say so plainly when the
    # runner really has no Homebrew, instead of failing at exit status 127
    # three lines later.
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - |
      command -v brew >/dev/null || {
        echo "no Homebrew on this runner ($(hostname)); it cannot build the bundle" >&2
        exit 1
      }
    - eval "$(brew shellenv)"
    # python@3.12: quip-solver-core requires >= 3.11 and the runner's system
    # python3 is below that floor. No build toolchain: quip-solver-core
    # publishes a macOS arm64 wheel since 0.0.1-rc1, so pip installs it
    # prebuilt — the rustup/protobuf bootstrap that built it from source is
    # gone with the source build.
    #
    # Install only when the interpreter is genuinely absent. `brew install`
    # writes into the Homebrew prefix even for a formula that is already
    # present, so it fails on a runner whose prefix belongs to another user:
    # quip-miner's v0.3.1-rc6 tag died that way on a newly added host, against
    # an unwritable /opt/homebrew. Skipping the install where python3.12
    # already exists avoids the write, and a runner that has neither the
    # interpreter nor a usable brew now says so in three lines instead of
    # printing Homebrew's chown advice for twenty.
    - |
      if ! command -v python3.12 >/dev/null 2>&1; then
        if ! brew install python@3.12; then
          echo "python3.12 is missing on $(hostname) and 'brew install python@3.12' failed" >&2
          echo "the Homebrew prefix is likely not writable by the runner user ($(id -un))" >&2
          echo "install python@3.12 for that user, or drop this host from the macos+arm64 pool" >&2
          exit 1
        fi
      fi
    - python3.12 --version
  script:
    - python3.12 -m venv .venv
    - . .venv/bin/activate
    - pip install -q --upgrade pip
    - pip install -q ".[dev]" pyinstaller
    # Library-level check before freezing. A break in Ocean or
    # quip_solver_core surfaces here with a readable traceback instead of as a
    # ModuleNotFoundError from inside the bundle.
    - pytest quip_miner_dwave/tests -q
    - pyinstaller --clean --noconfirm --distpath dist --workpath .pyi-build pyinstaller/quip-dwave-qa.spec
    - mv dist/quip-dwave-qa dist/quip-dwave-qa-darwin-arm64
    - ls -l dist/
    # The bundle has to run, not just build: PyInstaller reports success for a
    # binary that cannot import Ocean. `--check` imports dimod and dwave, which
    # is exactly what the namespace-package handling in the spec fixes.
    - ./dist/quip-dwave-qa-darwin-arm64 --version
    - ./dist/quip-dwave-qa-darwin-arm64 --capabilities
    - QUIP_DWAVE_MOCK=1 ./dist/quip-dwave-qa-darwin-arm64 --check
    # Self-contained means macOS system libraries only. A link against
    # Homebrew's libpython or libprotobuf would mean the binary runs on this
    # builder and nowhere else.
    - otool -L dist/quip-dwave-qa-darwin-arm64 | tail -n +2
    - "! otool -L dist/quip-dwave-qa-darwin-arm64 | grep -qE '/opt/homebrew|/usr/local'"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# On a tag: upload the wheel and the macOS executable to the generic package
# registry, then cut a Release linking both. Neither build job is optional, so
# a missing artifact means one of them failed — fail here rather than quietly
# publishing a release with a hole in it.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      for want in dist/*.whl dist/quip-dwave-qa-darwin-arm64; do
        if [ ! -f "$want" ]; then
          echo "missing $want — an upstream build job did not produce it" >&2
          exit 1
        fi
      done
      for f in dist/*.whl dist/quip-dwave-qa-darwin-arm64; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload, build-wheel, build-macos-arm64]
  before_script: []
  script:
    - |
      whl=$(basename dist/*.whl)
      bin=quip-dwave-qa-darwin-arm64
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      release-cli create --name "quip-miner-dwave ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"${whl}\",\"url\":\"${base}/${whl}\"}" \
        --assets-link "{\"name\":\"${bin}\",\"url\":\"${base}/${bin}\"}"
