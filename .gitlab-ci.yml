stages: [test, build, release]

variables:
  PKG: quip-solver-dwave
  # Pinned so a macOS build is reproducible and an upstream installer
  # change cannot land mid-release.
  UV_VERSION: "0.12.10"

default:
  image: python:3.12-slim
  tags: [linux, amd64]
  # quip_solver_core installs from a published PyPI wheel on Linux -> no Rust,
  # protoc, or compiler needed here.
  before_script:
    - pip install -q --upgrade pip

test:
  stage: test
  script:
    - pip install -e ".[dev]"
    - pytest quip_solver_dwave/tests -v

# End-to-end contract gate: drives the mock-mode miner through
# quip-solver-drive, the scripted coordinator from the published
# quip-solver-conformance crate. This harness caught the credit-ledger and
# sweeps-echo defects that the unit suite could not; without this job the
# repo's only conformance coverage lives in the Rust miner repos.
#
# The rust image is bookworm, so its apt python3 (3.11) meets the >= 3.11
# floor. Keep --version in step with the quip-solver-core pin in
# pyproject.toml: both publish from one repository and one tag.
conformance:
  stage: test
  image: rust:1.97.1
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends python3 python3-venv python3-pip
    - python3 -m venv /opt/venv
    - /opt/venv/bin/pip install -q -e ".[dev]"
  script:
    - cargo install --locked quip-solver-conformance --version 0.0.1-rc2
    - QUIP_SOLVER_DRIVE="$CARGO_HOME/bin/quip-solver-drive" /opt/venv/bin/pytest quip_solver_dwave/tests/test_conformance.py -v

build-wheel:
  stage: build
  script:
    - pip install -q build
    - python -m build --wheel
    - ls -l dist/
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# The coordinator spawns miners as subprocesses (`[dwave] binary =
# "quip-dwave-qa"`), so the miner also ships the way the CPU, CUDA and Metal
# miners do: one self-contained executable per OS/arch, named so that stripping
# the suffix gives the binary the coordinator asks for. The user's machine
# needs nothing but the file.
#
# Every platform shares this template. A job sets PLATFORM (`<os>-<arch>`, the
# asset suffix), activates a venv carrying Python 3.12 in its before_script,
# and appends its own linked-library check to the script below.
.build-frozen:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    # Also run on a merge request that changes the build itself. Each platform's
    # bootstrap can only be proved on that platform's runner, and proving it
    # after a tag is pushed is too late: a tag pipeline runs the .gitlab-ci.yml
    # that exists at that tag, so a fix cannot rescue a release already cut.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - pyinstaller/**/*
  script:
    - uv pip install -q ".[dev]" pyinstaller
    # Library-level check before freezing. A break in Ocean or
    # quip_solver_core surfaces here with a readable traceback instead of as a
    # ModuleNotFoundError from inside the bundle.
    - pytest quip_solver_dwave/tests -q
    - pyinstaller --clean --noconfirm --distpath dist --workpath .pyi-build pyinstaller/quip-dwave-qa.spec
    - mv dist/quip-dwave-qa "dist/quip-dwave-qa-${PLATFORM}"
    - ls -l dist/
    # The bundle has to run, not just build: PyInstaller reports success for a
    # binary that cannot import Ocean. `--check` imports dimod and dwave, which
    # is exactly what the namespace-package handling in the spec fixes.
    - ./dist/quip-dwave-qa-${PLATFORM} --version
    - ./dist/quip-dwave-qa-${PLATFORM} --capabilities
    - QUIP_DWAVE_MOCK=1 ./dist/quip-dwave-qa-${PLATFORM} --check
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Runs on the group's Apple Silicon runners (`cray`, `tesla-arm`), which are
# shell executors: `image:` does not apply and the default before_script's
# apt-get would fail, so this job replaces it wholesale.
build-macos-arm64:
  extends: .build-frozen
  tags: [macos, arm64]
  variables:
    PLATFORM: darwin-arm64
  before_script:
    # No Homebrew. This job needs one thing from the host, a Python 3.12
    # interpreter, and Homebrew is the wrong way to get it on a shared runner:
    # `brew install` writes into the Homebrew prefix even for a formula that is
    # already present, so it fails outright on any host whose prefix belongs to
    # another user. That failure took out three tags — v0.3.2-rc5,
    # quip-solver v0.3.1-rc6 and v0.3.2-rc8 — each time on a newly added host,
    # and each time the host had to be fixed by hand before a release could go
    # out.
    #
    # uv fetches a python-build-standalone interpreter into the runner user's
    # own directory. Nothing writes to /opt/homebrew, prefix ownership stops
    # mattering, and a new macos+arm64 host can build with no preparation.
    #
    # quip-solver-core requires >= 3.11 and publishes a macOS arm64 wheel, so
    # there is still no compiler, rustup or protoc bootstrap here.
    #
    # Always install, never "install only if missing". That guard was needed
    # for brew, whose install writes to a shared prefix and fails when the
    # prefix belongs to someone else. uv installs into $HOME, so there is no
    # such hazard, and skipping the install would leave whatever uv the host
    # happens to carry — which defeats the pin. A macos+arm64 host was found
    # carrying 0.11.7 this way.
    - export PATH="$HOME/.local/bin:$PATH"
    - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - uv --version
    # uv downloads 3.12 when the host does not already have it. before_script
    # and script share one shell, so this venv stays active below.
    - uv venv --python 3.12 .venv
    - . .venv/bin/activate
    - python --version
  script:
    - !reference [.build-frozen, script]
    # Self-contained means macOS system libraries only. A link against a
    # Homebrew or uv-managed libpython would mean the binary runs on this
    # builder and nowhere else.
    - otool -L dist/quip-dwave-qa-darwin-arm64 | tail -n +2
    - "! otool -L dist/quip-dwave-qa-darwin-arm64 | grep -qE '/opt/homebrew|/usr/local|/\\.local/share/uv'"

# Linux builds run in a container. Debian bookworm rather than the default
# image's newer base: the binary carries the builder's libpython, and that sets
# the oldest glibc the binary will start on. quip-solver-core's wheels are
# manylinux_2_34, so glibc 2.34 is the floor in any case.
.build-frozen-linux:
  extends: .build-frozen
  image: python:3.12-slim-bookworm
  before_script:
    # PyInstaller reads every extension's shared-library dependencies with
    # objdump, which the slim image does not carry.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends binutils
    - pip install -q "uv==${UV_VERSION}"
    - uv --version
    # Freeze the image's own interpreter rather than letting uv fetch another.
    # before_script and script share one shell, so this venv stays active
    # below.
    - uv venv --python-preference only-system --python 3.12 .venv
    - . .venv/bin/activate
    - python --version
  script:
    - !reference [.build-frozen, script]
    # ldd sees only the bootloader; the bundled libraries are unpacked and
    # loaded at run time. The bootloader must resolve against the base system
    # alone, not against the image's /usr/local Python or the build venv.
    - ldd dist/quip-dwave-qa-${PLATFORM}
    - "! ldd dist/quip-dwave-qa-${PLATFORM} | grep -qE 'not found|/usr/local|/\\.venv/'"

build-linux-amd64:
  extends: .build-frozen-linux
  tags: [linux, amd64]
  variables:
    PLATFORM: linux-amd64

# `docker` picks the group's Docker executors on Apple Silicon Macs
# (`tesla-docker`, `roman-mac-docker`), which run linux/arm64 images natively.
# `arm64` alone would also match the macOS shell runners, which ignore
# `image:`.
build-linux-arm64:
  extends: .build-frozen-linux
  tags: [arm64, docker]
  variables:
    PLATFORM: linux-arm64

# On a tag: upload the wheel and every frozen executable to the generic package
# registry, then cut a Release linking them. No build job is optional: a failed
# one stops the pipeline before this stage. The check below catches a glob that
# matched nothing, which the shell would otherwise pass on as a literal path —
# fail here rather than quietly publishing a release with a hole in it.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      for want in dist/*.whl dist/quip-dwave-qa-*; do
        if [ ! -f "$want" ]; then
          echo "missing $want — an upstream build job did not produce it" >&2
          exit 1
        fi
      done
      for f in dist/*.whl dist/quip-dwave-qa-*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload, build-wheel, build-macos-arm64, build-linux-amd64, build-linux-arm64]
  before_script: []
  script:
    - |
      whl=$(basename dist/*.whl)
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      # POSIX sh has no arrays; the positional parameters collect one
      # --assets-link per file.
      set -- --assets-link "{\"name\":\"${whl}\",\"url\":\"${base}/${whl}\"}"
      for f in dist/quip-dwave-qa-*; do
        bin=$(basename "$f")
        set -- "$@" --assets-link "{\"name\":\"${bin}\",\"url\":\"${base}/${bin}\"}"
      done
      release-cli create --name "quip-solver-dwave ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" "$@"
